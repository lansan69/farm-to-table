<div class="inicio-wrapper">

  <div class="inicio-header">
    <h2 class="inicio-title">Resumen de actividad</h2>
    <p class="inicio-subtitle">Seguimiento de tus negociaciones</p>
  </div>

  <div class="ring-grid">

    <!-- Esta semana -->
    <div class="ring-card">
      <svg id="ring-semana" class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="40"/>
        <circle class="ring-arc ring-arc--semana" cx="50" cy="50" r="40"
                stroke-dasharray="251.33" stroke-dashoffset="251.33"
                transform="rotate(-90 50 50)"/>
        <text class="ring-value" x="50" y="50"
              text-anchor="middle" dominant-baseline="central">0</text>
      </svg>
      <div class="ring-label">Esta semana</div>
      <div class="ring-sub" id="sub-semana">—</div>
    </div>

    <!-- Totales -->
    <div class="ring-card ring-card--featured">
      <svg id="ring-total" class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="40"/>
        <circle class="ring-arc ring-arc--total" cx="50" cy="50" r="40"
                stroke-dasharray="251.33" stroke-dashoffset="251.33"
                transform="rotate(-90 50 50)"/>
        <text class="ring-value" x="50" y="50"
              text-anchor="middle" dominant-baseline="central">0</text>
      </svg>
      <div class="ring-label">Total</div>
      <div class="ring-sub" id="sub-total">—</div>
    </div>

    <!-- Completadas -->
    <div class="ring-card">
      <svg id="ring-completadas" class="ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="40"/>
        <circle class="ring-arc ring-arc--completadas" cx="50" cy="50" r="40"
                stroke-dasharray="251.33" stroke-dashoffset="251.33"
                transform="rotate(-90 50 50)"/>
        <text class="ring-value" x="50" y="50"
              text-anchor="middle" dominant-baseline="central">0</text>
      </svg>
      <div class="ring-label">Completadas</div>
      <div class="ring-sub" id="sub-completadas">—</div>
    </div>

  </div>

</div>
