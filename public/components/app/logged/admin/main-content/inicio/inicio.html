<div class="inicio-page">

  <div class="inicio-header">
    <div>
      <h1 class="inicio-title">Panel de control</h1>
      <p class="inicio-sub" id="inicioDat"></p>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-row">

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--green">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
        </svg>
      </div>
      <div class="kpi-text">
        <span class="kpi-val" id="kpiUsersVal">—</span>
        <span class="kpi-lbl">Usuarios</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--teal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5zM3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
        </svg>
      </div>
      <div class="kpi-text">
        <span class="kpi-val" id="kpiLotesVal">—</span>
        <span class="kpi-lbl">Lotes activos</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--amber">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
        </svg>
      </div>
      <div class="kpi-text">
        <span class="kpi-val" id="kpiZonasVal">—</span>
        <span class="kpi-lbl">Zonas operativas</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon kpi-icon--red">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
        </svg>
      </div>
      <div class="kpi-text">
        <span class="kpi-val" id="kpiReportesVal">—</span>
        <span class="kpi-lbl">Reportes</span>
      </div>
    </div>

  </div>

  <!-- Widgets -->
  <div class="inicio-widgets">

    <div class="widget-card">
      <div class="widget-header">
        <h2 class="widget-title">Últimos reportes</h2>
        <a class="widget-link" id="linkReportes">Ver todos</a>
      </div>
      <div id="recentReports" class="widget-list"></div>
    </div>

    <div class="widget-card">
      <div class="widget-header">
        <h2 class="widget-title">Usuarios recientes</h2>
        <a class="widget-link" id="linkUsuarios">Ver todos</a>
      </div>
      <div id="recentUsers" class="widget-list"></div>
    </div>

  </div>

</div>
