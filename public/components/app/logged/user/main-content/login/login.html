<div class="auth-wrapper" id="authWrapper">

  <!-- LOGIN FORM -->
  <div class="panel panel-form login-form">
    <h1>Iniciar Sesión</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <input type="email" placeholder="Email" id="login-email" autocomplete="email"/>
      </div>

      <div class="field">
        <input type="password" placeholder="Contraseña" id="login-password" autocomplete="current-password"/>
        <button class="eye-btn" type="button" aria-label="Mostrar contraseña">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>

      <button class="btn-primary" type="submit">Entrar</button>
    </form>

    <div class="divider">o</div>

    <button class="btn-google">
      <span class="google-icon">G</span>
      Continuar con Google
    </button>
  </div>

  <!-- LOGIN IMAGE -->
  <div class="panel panel-image login-image">
    <img src="assets/images/login/frutas.jpeg" alt="Frutas frescas"/>
    <div class="panel-image-content">
      <h2>¿Aún no tienes una cuenta?</h2>
      <p>Regístrate con tus datos personales para unirte a nuestra comunidad</p>
      <button class="btn-outline" id="btnShowRegister">Registrarse</button>
    </div>
  </div>

  <!-- REGISTER IMAGE -->
  <div class="panel panel-image register-image">
    <img src="assets/images/login/frutas.jpeg" alt="Frutas frescas"/>
    <div class="panel-image-content">
      <h2>¿Ya tienes una cuenta?</h2>
      <p>Si ya eres parte de la comunidad, inicia sesión para continuar explorando productos o publicando los tuyos.</p>
      <button class="btn-outline" id="btnShowLogin">Iniciar Sesión</button>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div class="panel panel-form register-form">
    <h1>Crear Cuenta</h1>

    <form id="registerForm" novalidate>
      <div class="role-selector">
        <label class="role-option">
          <input type="radio" name="role" value="usuario" checked/>
          <span class="radio-dot"></span>
          <span>Usuario</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="productor"/>
          <span class="radio-dot"></span>
          <span>Productor</span>
        </label>
      </div>

      <div class="field">
        <input type="text" placeholder="Nombre" id="reg-name" autocomplete="name"/>
      </div>

      <div class="field">
        <input type="text" placeholder="Nombre" id="reg-name" autocomplete="name"/>
      </div>

      <div class="field">
        <input type="text" placeholder="Nombre" id="reg-name" autocomplete="name"/>
      </div>

      <div class="field">
        <input type="text" placeholder="Nombre" id="reg-name" autocomplete="name"/>
      </div>

      <div class="field">
        <input type="tel" placeholder="Teléfono" id="reg-phone" autocomplete="tel"/>
      </div>

      <div class="field">
        <input type="email" placeholder="Email" id="reg-email" autocomplete="email"/>
      </div>

      <div class="field">
        <input type="password" placeholder="Contraseña" id="reg-password"/>
        <button class="eye-btn" type="button" aria-label="Mostrar contraseña">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="field">
        <input type="password" placeholder="Confirmar contraseña" id="reg-confirm"/>
        <button class="eye-btn" type="button" aria-label="Mostrar contraseña">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button class="btn-primary" type="submit">Registrarse</button>
    </form>

    <div class="divider">o</div>

    <button class="btn-google">
      <span class="google-icon">G</span>
      Continuar con Google
    </button>
  </div>

</div>
