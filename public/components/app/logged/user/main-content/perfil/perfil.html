<div class="perfil-page d-flex">
 
  <!-- ════ SIDEBAR ════ -->
  <div class="sidebar-info d-flex flex-column" style="flex: 0 0 calc(20% - 12px);">
 
    <div class="sidebar-info__image-container">
      <div class="sidebar-info__avatar">
        <!-- Replace with <img> when you have a real photo -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <div class="sidebar-info__avatar-badge" title="Cambiar foto">
        <svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
 
    <!-- Name & role: populated via JS -->
    <div class="sidebar-info__name text-center" id="sidebar-name">—</div>
    <div class="text-center">
      <span class="sidebar-info__role-pill" id="sidebar-role">Usuario</span>
    </div>
 
    <hr class="sidebar-info__divider"/>
 
    <div class="sidebar-info__field">
      <div class="sidebar-info__field-label">Email</div>
      <div class="sidebar-info__field-value sidebar-info__email" id="sidebar-email">—</div>
    </div>
    <div class="sidebar-info__field">
      <div class="sidebar-info__field-label">Teléfono</div>
      <div class="sidebar-info__field-value sidebar-info__telefono" id="sidebar-phone">—</div>
    </div>
    <div class="sidebar-info__field">
      <div class="sidebar-info__field-label">Ubicación</div>
      <div class="sidebar-info__field-value sidebar-info__zona" id="sidebar-location">—</div>
    </div>
    <div class="sidebar-info__field">
      <div class="sidebar-info__field-label">Miembro desde</div>
      <div class="sidebar-info__field-value sidebar-info__member-since" id="sidebar-since">—</div>
    </div>
 
    <button class="negoc-btn negoc-btn--msg mt-auto" onclick="handleEditarPerfil()">
      Editar información
    </button>
  </div>
 
  <!-- ════ MAIN ════ -->
  <div class="rest-of-info" style="flex: 0 0 calc(80% - 12px);">
 
    <!-- Card 1: Tipo de Cuenta -->
    <div class="info-card">
      <div class="info-card__title">Tipo de Cuenta</div>
      <div class="account-type-options">
 
        <div class="account-type-option active" id="opt-usuario" onclick="selectAccountType('usuario')">
          <div class="account-type-option__radio"></div>
          <div class="account-type-option__text">
            <strong>Usuario</strong>
            <span>Comprador · Asociación</span>
          </div>
        </div>
 
        <div class="account-type-option" id="opt-productor" onclick="selectAccountType('productor')">
          <div class="account-type-option__radio"></div>
          <div class="account-type-option__text">
            <strong>Productor</strong>
            <span>Productores regionales</span>
          </div>
        </div>
 
      </div>
    </div>
 
    <!-- Card 2: Historial -->
    <div class="info-card">
      <div class="info-card__title">Historial de Actividad Reciente</div>
      <div id="activity-list">
        <!-- Populated via JS: addActivityRow(desc, date, status) -->
      </div>
    </div>
 
    <!-- Card 3: Password + Logout -->
    <div class="bottom-row">
 
      <div class="info-card">
        <div class="info-card__title">Cambiar contraseña</div>
        <div class="password-input-wrap">
          <div class="password-field-wrap">
            <input type="password" id="password-input" placeholder="••••••••••••••" autocomplete="new-password"/>
            <button class="password-toggle" onclick="togglePassword()" aria-label="Mostrar contraseña">
              <svg id="eye-icon" viewBox="0 0 24 24" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <button class="negoc-btn negoc-btn--modificar" onclick="handleModificarPassword()">
            Modificar
          </button>
        </div>
      </div>
 
      <div class="info-card d-flex align-items-center justify-content-center">
        <button class="logout-btn" onclick="handleCerrarSesion()">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
 
    </div>
  </div>
</div>
