<div class="chat-layout">

  <!-- Left panel: contact list -->
  <aside class="contact-list">
    <div id="contact-search" class="contact-list__search"></div>
    <div id="chat-filters" class="chat-filter-bar">
      <button class="chat-filter active" data-filter="">Todo</button>
      <button class="chat-filter" data-filter="en_curso">En curso</button>
      <button class="chat-filter" data-filter="terminadas">Terminadas</button>
    </div>
    <div id="contact-items" class="contact-list__items"></div>
  </aside>

  <!-- Right panel: open chat -->
  <section class="chat-window">
    <div id="chat-header"></div>
    <div id="chat-messages" class="chat-window__messages"></div>
    <div id="chat-input"></div>
  </section>

</div>
