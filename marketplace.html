<div class="marketplace-page">
  <header class="topbar">
    <div class="brand">
      <button class="menu-btn">☰</button>
      <h1>FARM TO TABLE</h1>
    </div>

    <nav>
      <a href="#">Inicio</a>
      <a href="#">Perfil</a>
      <img src="assets/images/logo.png" alt="Logo" class="logo">
    </nav>
  </header>

  <main class="marketplace">
    <h2>Mercado</h2>

    <section class="market-actions">
      <div class="filters">
        <button class="filter active" data-category="todo">Todo</button>
        <button class="filter" data-category="vegetales">Vegetales</button>
        <button class="filter" data-category="frutas">Frutas</button>
      </div>

      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar productos...">
      </div>
    </section>

    <section class="products-grid" id="productsGrid"></section>
  </main>
</div>

<link rel="stylesheet" href="marketplace.css">
<script src="marketplace.js" defer></script>
